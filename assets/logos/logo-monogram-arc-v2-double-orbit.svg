<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <style><![CDATA[
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700&display=swap');
    ]]></style>
  </defs>

  <circle cx="100" cy="100" r="100" fill="#faf6f0"/>

  <!-- Outer ring -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="#d4c4b0" stroke-width="1.2"/>

  <!-- Orbit 1 — primary (terracotta, original tilt -8°) -->
  <ellipse cx="100" cy="127" rx="62" ry="18"
    fill="none" stroke="#7a3f22" stroke-width="1.5"
    stroke-dasharray="5 4"
    transform="rotate(-8 100 127)"/>

  <!-- Satellite 1 (terracotta, right side) -->
  <circle cx="157" cy="117" r="5" fill="#7a3f22"/>

  <!-- Orbit 2 — secondary (amber, steeper tilt +22°) -->
  <ellipse cx="100" cy="120" rx="52" ry="12"
    fill="none" stroke="#c47840" stroke-width="1.2"
    stroke-dasharray="4 5"
    transform="rotate(22 100 120)"/>

  <!-- Satellite 2 (amber, left side of orbit 2) -->
  <circle cx="52" cy="101" r="4" fill="#c47840"/>

  <!-- AA monogram -->
  <text x="100" y="124"
    text-anchor="middle"
    font-family="'Cormorant Garamond', Georgia, 'Times New Roman', serif"
    font-size="66" font-weight="700"
    fill="#2a1c12" letter-spacing="-3">AA</text>
</svg>
