<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 76" width="380" height="76">
  <defs>
    <style><![CDATA[
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700&family=JetBrains+Mono&display=swap');
    ]]></style>
  </defs>

  <rect width="380" height="76" fill="#faf6f0"/>

  <!-- Left rule -->
  <line x1="12" y1="30" x2="86" y2="30" stroke="#d4c4b0" stroke-width="1"/>
  <!-- Right rule -->
  <line x1="294" y1="30" x2="368" y2="30" stroke="#d4c4b0" stroke-width="1"/>

  <!-- Diamond terminators (terracotta, slightly transparent) -->
  <!-- Left diamond at (92, 30) -->
  <polygon points="92,26 98,30 92,34 86,30" fill="#7a3f22" opacity="0.65"/>
  <!-- Right diamond at (288, 30) -->
  <polygon points="288,26 294,30 288,34 282,30" fill="#7a3f22" opacity="0.65"/>

  <!-- Name -->
  <text x="190" y="40"
    text-anchor="middle"
    font-family="'Cormorant Garamond', Georgia, 'Times New Roman', serif"
    font-size="28" font-weight="700"
    fill="#2a1c12" letter-spacing="4">AREF ABDALA</text>

  <!-- Separator line (between diamonds) -->
  <line x1="92" y1="50" x2="288" y2="50" stroke="#d4c4b0" stroke-width="0.8"/>

  <!-- Tagline -->
  <text x="190" y="65"
    text-anchor="middle"
    font-family="'JetBrains Mono', 'Courier New', Courier, monospace"
    font-size="8.5" fill="#7a3f22" letter-spacing="4">AEROSPACE · ENGINEER</text>
</svg>
