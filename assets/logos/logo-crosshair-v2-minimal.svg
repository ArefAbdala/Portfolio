<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <style><![CDATA[
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700&display=swap');
    ]]></style>
  </defs>

  <circle cx="100" cy="100" r="100" fill="#faf6f0"/>

  <!-- Outer ring (thin) -->
  <circle cx="100" cy="100" r="88" fill="none" stroke="#d4c4b0" stroke-width="0.8"/>

  <!-- Center ring only — no middle ring -->
  <circle cx="100" cy="100" r="42" fill="none" stroke="#7a3f22" stroke-width="1"/>

  <!-- Crosshair lines (thin) -->
  <line x1="100" y1="12" x2="100" y2="58" stroke="#7a3f22" stroke-width="0.8"/>
  <line x1="100" y1="142" x2="100" y2="188" stroke="#7a3f22" stroke-width="0.8"/>
  <line x1="12" y1="100" x2="58" y2="100" stroke="#7a3f22" stroke-width="0.8"/>
  <line x1="142" y1="100" x2="188" y2="100" stroke="#7a3f22" stroke-width="0.8"/>

  <!-- Cardinal tick marks only — no diagonal ticks -->
  <line x1="100" y1="12" x2="100" y2="18" stroke="#7a3f22" stroke-width="2"/>
  <line x1="100" y1="182" x2="100" y2="188" stroke="#7a3f22" stroke-width="2"/>
  <line x1="12" y1="100" x2="18" y2="100" stroke="#7a3f22" stroke-width="2"/>
  <line x1="182" y1="100" x2="188" y2="100" stroke="#7a3f22" stroke-width="2"/>

  <!-- AA monogram -->
  <text x="100" y="112"
    text-anchor="middle"
    font-family="'Cormorant Garamond', Georgia, 'Times New Roman', serif"
    font-size="46" font-weight="700"
    fill="#2a1c12" letter-spacing="-2">AA</text>
</svg>
