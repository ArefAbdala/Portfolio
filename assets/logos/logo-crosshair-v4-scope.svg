<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <style><![CDATA[
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700&display=swap');
    ]]></style>
  </defs>

  <circle cx="100" cy="100" r="100" fill="#faf6f0"/>

  <!-- Outer ring -->
  <circle cx="100" cy="100" r="88" fill="none" stroke="#d4c4b0" stroke-width="1.2"/>

  <!-- Inner scope ring (no center ring — lines run full diameter) -->
  <circle cx="100" cy="100" r="55" fill="none" stroke="#7a3f22" stroke-width="1" opacity="0.45"/>

  <!-- Full-diameter crosshair lines (faint — AA sits on top) -->
  <line x1="12" y1="100" x2="188" y2="100" stroke="#7a3f22" stroke-width="0.8" opacity="0.3"/>
  <line x1="100" y1="12" x2="100" y2="188" stroke="#7a3f22" stroke-width="0.8" opacity="0.3"/>

  <!-- Cardinal tick marks (bold) -->
  <line x1="100" y1="12" x2="100" y2="19" stroke="#7a3f22" stroke-width="2.5"/>
  <line x1="100" y1="181" x2="100" y2="188" stroke="#7a3f22" stroke-width="2.5"/>
  <line x1="12" y1="100" x2="19" y2="100" stroke="#7a3f22" stroke-width="2.5"/>
  <line x1="181" y1="100" x2="188" y2="100" stroke="#7a3f22" stroke-width="2.5"/>

  <!-- 45° diagonal tick marks -->
  <line x1="162" y1="38" x2="156" y2="44" stroke="#d4c4b0" stroke-width="1.2"/>
  <line x1="38" y1="38" x2="44" y2="44" stroke="#d4c4b0" stroke-width="1.2"/>
  <line x1="162" y1="162" x2="156" y2="156" stroke="#d4c4b0" stroke-width="1.2"/>
  <line x1="38" y1="162" x2="44" y2="156" stroke="#d4c4b0" stroke-width="1.2"/>

  <!-- AA monogram overlaid on crosshairs -->
  <text x="100" y="112"
    text-anchor="middle"
    font-family="'Cormorant Garamond', Georgia, 'Times New Roman', serif"
    font-size="46" font-weight="700"
    fill="#2a1c12" letter-spacing="-2">AA</text>
</svg>
