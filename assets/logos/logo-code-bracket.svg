<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 144" width="240" height="144">
  <defs>
    <style><![CDATA[
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');
    ]]></style>
  </defs>

  <rect width="240" height="144" fill="#faf6f0"/>

  <!-- Top rule -->
  <line x1="14" y1="20" x2="226" y2="20" stroke="#d4c4b0" stroke-width="1"/>
  <!-- Bottom rule -->
  <line x1="14" y1="126" x2="226" y2="126" stroke="#d4c4b0" stroke-width="1"/>

  <!-- Engineering drawing corner marks (L-shapes) -->
  <path d="M 14,32 L 14,20 L 26,20" fill="none" stroke="#7a3f22" stroke-width="1.5" stroke-linecap="square"/>
  <path d="M 214,20 L 226,20 L 226,32" fill="none" stroke="#7a3f22" stroke-width="1.5" stroke-linecap="square"/>
  <path d="M 14,114 L 14,126 L 26,126" fill="none" stroke="#7a3f22" stroke-width="1.5" stroke-linecap="square"/>
  <path d="M 214,126 L 226,126 L 226,114" fill="none" stroke="#7a3f22" stroke-width="1.5" stroke-linecap="square"/>

  <!-- [ AA ] bracket text with colored brackets -->
  <text x="120" y="96"
    text-anchor="middle"
    font-family="'JetBrains Mono', 'Courier New', Courier, monospace"
    font-size="54" font-weight="700">
    <tspan fill="#7a3f22">[ </tspan><tspan fill="#2a1c12">AA</tspan><tspan fill="#7a3f22"> ]</tspan>
  </text>

  <!-- Code comment tagline -->
  <text x="120" y="116"
    text-anchor="middle"
    font-family="'JetBrains Mono', 'Courier New', Courier, monospace"
    font-size="8" fill="#6b5040" letter-spacing="1.5">// AEROSPACE · ENGINEER</text>
</svg>
